<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220" role="img" aria-label="AFTERGROUND — Rebuild What Remains">
  <defs>
    <linearGradient id="mainAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="mainSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="mainBio" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background Technical Frame -->
  <rect x="6" y="6" width="668" height="208" rx="14" fill="#090d16" fill-opacity="0.88" stroke="#334155" stroke-width="2"/>
  <path d="M22,6 L90,6 M590,6 L658,6 M22,214 L90,214 M590,214 L658,214" stroke="#f59e0b" stroke-width="3"/>

  <!-- Left Emblem Symbol -->
  <g transform="translate(30, 30) scale(1.25)">
    <polygon points="64,3 119,32.5 119,95.5 64,125 9,95.5 9,32.5" fill="#0f172a" stroke="url(#mainAmber)" stroke-width="3.5"/>
    <!-- Sky & Surface Spire -->
    <circle cx="64" cy="40" r="22" fill="#f59e0b" opacity="0.16"/>
    <rect x="30" y="42" width="9" height="20" fill="#475569"/>
    <rect x="41" y="34" width="11" height="28" fill="#64748b"/>
    <polygon points="54,62 54,23 64,14 74,23 74,62" fill="#e2e8f0"/>
    <rect x="61" y="8" width="6" height="7" fill="#fbbf24"/>
    <rect x="76" y="35" width="11" height="27" fill="#64748b"/>
    <rect x="89" y="43" width="9" height="19" fill="#475569"/>
    <!-- Surface Green Line -->
    <path d="M12,62 Q64,57 116,62 L116,69 L12,69 Z" fill="#22c55e"/>
    <!-- Underground Strata -->
    <polygon points="12,68 116,68 116,85 64,91 12,85" fill="#78350f"/>
    <polygon points="12,84 64,90 116,84 116,102 64,108 12,102" fill="#451a03"/>
    <polygon points="14,100 64,106 114,100 64,122" fill="#1c1917"/>
    <!-- Shaft & Modules -->
    <rect x="59" y="62" width="10" height="46" fill="#090d16" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="28" y="72" width="24" height="8" rx="1.5" fill="#090d16" stroke="#4ade80" stroke-width="1.4"/>
    <rect x="76" y="72" width="24" height="8" rx="1.5" fill="#090d16" stroke="#4ade80" stroke-width="1.4"/>
    <rect x="34" y="89" width="20" height="8" rx="1.5" fill="#090d16" stroke="#fbbf24" stroke-width="1.4"/>
    <rect x="74" y="89" width="20" height="8" rx="1.5" fill="#090d16" stroke="#fbbf24" stroke-width="1.4"/>
    <circle cx="64" cy="108" r="6.5" fill="#090d16" stroke="#4ade80" stroke-width="1.8"/>
    <circle cx="64" cy="108" r="3" fill="#fbbf24"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(205, 0)">
    <!-- Era / Sector Tag -->
    <rect x="2" y="34" width="184" height="22" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
    <text x="12" y="49" fill="#4ade80" font-family="'Courier New', monospace" font-size="11" font-weight="700" letter-spacing="2.2">COLONY OS // 2241 A.E.</text>

    <!-- Main Title AFTERGROUND -->
    <text x="0" y="114" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="56" font-weight="900" letter-spacing="4.5" fill="url(#mainSteel)">AFTER</text>
    <text x="206" y="114" font-family="'Trebuchet MS', 'Segoe UI', sans-serif" font-size="56" font-weight="900" letter-spacing="4.5" fill="url(#mainAmber)">GROUND</text>

    <!-- Strata Horizon Divider -->
    <rect x="2" y="128" width="436" height="4" rx="2" fill="url(#mainBio)"/>
    <rect x="2" y="135" width="290" height="2" fill="#78350f"/>

    <!-- Subtitle -->
    <text x="4" y="164" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="7.5">REBUILD WHAT REMAINS</text>

    <!-- Subterranean Coordinates Accent -->
    <text x="4" y="186" fill="#94a3b8" font-family="'Courier New', monospace" font-size="11" letter-spacing="1.8">SURFACE &amp; SUBTERRANEAN CIVILIZATION SIMULATOR</text>
  </g>
</svg>
