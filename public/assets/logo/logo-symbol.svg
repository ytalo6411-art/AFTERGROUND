<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="AFTERGROUND Symbol">
  <defs>
    <linearGradient id="agSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="agAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="agBioGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <clipPath id="agHexClip">
      <polygon points="64,6 116,34 116,94 64,122 12,94 12,34"/>
    </clipPath>
  </defs>

  <!-- Outer Industrial Hex Frame -->
  <polygon points="64,3 119,32.5 119,95.5 64,125 9,95.5 9,32.5" fill="#090d16" stroke="url(#agAmberGrad)" stroke-width="3.5"/>

  <g clip-path="url(#agHexClip)">
    <!-- Sky / Atmosphere -->
    <rect x="8" y="6" width="112" height="58" fill="url(#agSkyGrad)"/>

    <!-- Amber Beacon Halo -->
    <circle cx="64" cy="40" r="24" fill="#f59e0b" opacity="0.16"/>
    <circle cx="64" cy="40" r="16" fill="#4ade80" opacity="0.14"/>

    <!-- Surface Skyline / Rebuilt Spire City -->
    <rect x="26" y="42" width="10" height="22" fill="#475569"/>
    <rect x="38" y="34" width="12" height="30" fill="#64748b"/>
    <polygon points="53,64 53,24 64,15 75,24 75,64" fill="#cbd5e1"/>
    <rect x="61" y="9" width="6" height="8" fill="#fbbf24"/>
    <rect x="78" y="36" width="12" height="28" fill="#64748b"/>
    <rect x="92" y="44" width="10" height="20" fill="#475569"/>

    <!-- Illuminated Windows -->
    <rect x="61" y="24" width="6" height="4" fill="#fbbf24"/>
    <rect x="61" y="32" width="6" height="4" fill="#4ade80"/>
    <rect x="42" y="40" width="4" height="4" fill="#fbbf24"/>
    <rect x="82" y="42" width="4" height="4" fill="#fbbf24"/>

    <!-- Surface Bio-Horizon Layer -->
    <path d="M8,62 Q36,58 64,62 T120,62 L120,70 L8,70 Z" fill="url(#agBioGrad)"/>

    <!-- Shallow Subterranean Stratum (Earth) -->
    <polygon points="8,68 120,68 120,86 64,92 8,86" fill="#78350f"/>

    <!-- Mid Subterranean Stratum (Stone & Ore) -->
    <polygon points="8,84 64,90 120,84 120,104 64,110 8,104" fill="#451a03"/>

    <!-- Deep Subterranean Core -->
    <polygon points="8,102 64,108 120,102 120,124 8,124" fill="#1c1917"/>

    <!-- Central Elevator Shaft & Underground Vault -->
    <rect x="59" y="62" width="10" height="48" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5"/>
    <line x1="64" y1="62" x2="64" y2="110" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Subterranean Rooms / Tunnels -->
    <rect x="28" y="73" width="24" height="9" rx="2" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="76" y="73" width="24" height="9" rx="2" fill="#0f172a" stroke="#4ade80" stroke-width="1.5"/>
    <rect x="34" y="91" width="20" height="9" rx="2" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
    <rect x="74" y="91" width="20" height="9" rx="2" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>

    <!-- Deep Geothermal Core Node -->
    <circle cx="64" cy="110" r="8" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
    <circle cx="64" cy="110" r="4" fill="#fbbf24"/>
  </g>

  <!-- Inner Frame Highlights -->
  <polygon points="64,7 115,34.5 115,93.5 64,121 13,93.5 13,34.5" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.45"/>
</svg>
